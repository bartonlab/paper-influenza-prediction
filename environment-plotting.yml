name: influenza-figures
channels:
  - conda-forge
dependencies:
  - python=3.14.7
  - numpy=2.5.2
  - scipy=1.18.0
  - pandas=3.0.5
  - scikit-learn=1.9.0
  - matplotlib=3.11.1
  - pillow=12.3.0
  - seaborn=0.13.2
  - jupyterlab=4.6.3
  - ipykernel=7.3.0
  - nbformat=5.11.1
  - nbclient=0.11.0
  - nbconvert=7.17.1
  - pyyaml=6.0.3

# Structure preprocessing additionally requires gemmi and freesasa. Those are
# optional because the canonical plotting inputs already contain the rendered
# structure assets and SASA tables used by the figures.
